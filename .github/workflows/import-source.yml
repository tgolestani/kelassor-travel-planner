name: Import existing Kelassor source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified Sites source snapshot
        run: |
          curl --fail --location --retry 2 https://sb-yw6fr0i6vvth.vercel.run/source.tar.gz -o /tmp/kelassor-source.tar.gz
          echo 'e761284baf8f3030f4a9e3226b61709bc144fe2d997094eb2fb8625195dcd491  /tmp/kelassor-source.tar.gz' | sha256sum --check
          tar -xzf /tmp/kelassor-source.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import Kelassor source from Sites commit 4329e5dee009dc2f802af5d1a6b5127e83e5e3ce'
          git push origin HEAD:main
